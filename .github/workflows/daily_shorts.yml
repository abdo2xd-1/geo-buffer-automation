name: Daily Shorts Publisher (2 Shorts Daily)

on:
  schedule:
    # يعمل مرتين يومياً: الساعة 11:00 صباحاً و 5:00 مساءً بتوقيت UTC
    # (أي 1:00 ظهراً و 7:00 مساءً بتوقيت مصر)
    - cron: '0 11,17 * * *'
  workflow_dispatch: # للتشغيل اليدوي في أي وقت

jobs:
  publish_shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shorts Publisher
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: python main_publisher.py
