name: Publish Daily Shorts

on:
  schedule:
    - cron: '0 11 * * *'  # تشغيل تلقائي يومي
  workflow_dispatch:      # تشغيل يدوي

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [MASAR, MASHAREE, ABAAD]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai edge-tts gTTS requests

      - name: Run Shorts Publisher (${{ matrix.channel }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main_publisher.py ${{ matrix.channel }}
