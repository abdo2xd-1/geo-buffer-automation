name: Publish Daily Shorts

on:
  workflow_dispatch: # يتيح لك التشغيل اليدوي وقتما تحب
  schedule:
    # يعمل تلقائياً كل يوم الساعة 3 عصراً بتوقيت جرينتش (5 مساءً بتوقيت مصر)
    - cron: '0 15 * * *'

jobs:
  publish_shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Shorts Publisher
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          python main_publisher.py
