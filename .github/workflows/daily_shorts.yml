name: Publish Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

jobs:
  publish_shorts:
    runs-on: ubuntu-latest
    # 1. إعطاء السيرفر مهلة 3 ساعات كاملة لإنهاء رندر القنوات الثلاث براحته
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Shorts Publisher
        # 2. ضمان عدم إيقاف خطوة الرندر والنشر عند الدقيقة 30
        timeout-minutes: 180
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          python main_publisher.py
