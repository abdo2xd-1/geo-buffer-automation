# 1. قناة أبعاد جغرافية
      - name: Produce & Upload - أبعاد جغرافية
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN_ABAAD: ${{ secrets.REFRESH_TOKEN_ABAAD }}
        run: |
          python long_documentary_publisher.py --channel abaad
          python api_uploader.py abaad documentary_abaad.mp4 "أبعاد جغرافية: صراع الممرات البحرية والتجارة الدولية" "تحقيق استقصائي يكشف أسرار المضائق والممرات الاستراتيجية. #أبعاد_جغرافية"

      # 2. قناة مشاريع عملاقة
      - name: Produce & Upload - مشاريع عملاقة
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN_MASHAREE: ${{ secrets.REFRESH_TOKEN_MASHAREE }}
        run: |
          python long_documentary_publisher.py --channel masharee
          python api_uploader.py masharee documentary_masharee.mp4 "مشاريع عملاقة: معجزات هندسية تحدت قوانين الطبيعة" "وثائقي شامل يستعرض تفاصيل أضخم الإنشاءات الهندسية عالمياً. #مشاريع_عملاقة"

      # 3. قناة مسار
      - name: Produce & Upload - مسار
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN_MASAR: ${{ secrets.REFRESH_TOKEN_MASAR }}
        run: |
          python long_documentary_publisher.py --channel masar
          python api_uploader.py masar documentary_masar.mp4 "مسار: خطوط التجارة وصناعة القوى العالمية" "وثائقي تحليلي استقصائي يسلط الضوء على خفايا سلاسل الإمداد ومستقبل الاقتصاد. #مسار"
