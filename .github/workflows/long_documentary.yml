name: Generate 8-Min Long Documentary

on:
  workflow_dispatch:
  schedule:
    # يعمل مرتين أسبوعياً (الأحد والأربعاء الساعة 6 مساءً)
    - cron: '0 18 * * 0,3'

jobs:
  build_documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "moviepy==1.0.3" edge-tts requests pillow numpy arabic-reshaper python-bidi

      - name: Produce Long-Form Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python long_documentary_publisher.py

      - name: Upload Video as Artifact (معاينة الفيلم قبل النشر)
        uses: actions/upload-artifact@v4
        with:
          name: Full-8Min-Documentary
          path: documentary_8min.mp4
          retention-days: 3
