name: Produce and Upload Long Documentaries

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [MASAR, MASHAREE, ABAAD]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai edge-tts gTTS requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Produce & Upload (${{ matrix.channel }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN_MASAR: ${{ secrets.REFRESH_TOKEN_MASAR }}
          REFRESH_TOKEN_MASHAREE: ${{ secrets.REFRESH_TOKEN_MASHAREE }}
          REFRESH_TOKEN_ABAAD: ${{ secrets.REFRESH_TOKEN_ABAAD }}
        run: |
          python long_documentary_publisher.py ${{ matrix.channel }}
